name: Build OmniGram APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out OmniGram with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore native dependencies
        run: |
          restore_repo() {
            local url="$1"
            local path="$2"
            if [ ! -d "$path" ] || [ -z "$(find "$path" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              rm -rf "$path"
              mkdir -p "$(dirname "$path")"
              git clone --depth 1 "$url" "$path"
            fi
          }
          restore_repo https://github.com/webmproject/libvpx.git TMessagesProj/jni/third_party/libvpx
          restore_repo https://github.com/videolan/dav1d.git TMessagesProj/jni/third_party/dav1d
          restore_repo https://github.com/FFmpeg/FFmpeg.git TMessagesProj/jni/third_party/ffmpeg
          restore_repo https://github.com/xiph/ogg.git TMessagesProj/jni/third_party/xiph/ogg
          restore_repo https://github.com/xiph/opus.git TMessagesProj/jni/third_party/xiph/opus
          restore_repo https://github.com/xiph/opusfile.git TMessagesProj/jni/third_party/xiph/opusfile
          restore_repo https://github.com/cisco/openh264.git TMessagesProj/jni/third_party/openh264
          restore_repo https://chromium.googlesource.com/libyuv/libyuv TMessagesProj/jni/third_party/libyuv
          restore_repo https://github.com/dkaraush/tlottie.git TMessagesProj/jni/tlottie

      - name: Restore jlatexmath dependency
        run: |
          if [ ! -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ]; then
            git clone --depth 1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          fi
          test -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle

      - name: Restore Gradle and CMake caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            TMessagesProj/.cxx
          key: ${{ runner.os }}-omnigram-build-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', '**/*.gradle.kts', 'TMessagesProj/jni/**') }}
          restore-keys: |
            ${{ runner.os }}-omnigram-build-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || {
            echo 'Missing GOOGLE_SERVICES_JSON_BASE64 repository secret.' >&2
            exit 1
          }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > TMessagesProj_App/google-services.json
          chmod 600 TMessagesProj_App/google-services.json

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_PART_1: ${{ secrets.RELEASE_KEYSTORE_PART_1 }}
          RELEASE_KEYSTORE_PART_2: ${{ secrets.RELEASE_KEYSTORE_PART_2 }}
          RELEASE_KEYSTORE_PART_3: ${{ secrets.RELEASE_KEYSTORE_PART_3 }}
          RELEASE_KEYSTORE_PART_4: ${{ secrets.RELEASE_KEYSTORE_PART_4 }}
        run: |
          test -n "$RELEASE_KEYSTORE_PART_1" && test -n "$RELEASE_KEYSTORE_PART_2" && \
            test -n "$RELEASE_KEYSTORE_PART_3" && test -n "$RELEASE_KEYSTORE_PART_4" || {
            echo 'Missing one or more RELEASE_KEYSTORE_PART_* repository secrets.' >&2
            exit 1
          }
          printf '%s%s%s%s' "$RELEASE_KEYSTORE_PART_1" "$RELEASE_KEYSTORE_PART_2" "$RELEASE_KEYSTORE_PART_3" "$RELEASE_KEYSTORE_PART_4" \
            | python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex(sys.stdin.read()))' > TMessagesProj/config/release.keystore
          chmod 600 TMessagesProj/config/release.keystore

      - name: Build signed release APK
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          GRADLE_OPTS: -Dorg.gradle.workers.max=4
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD" || { echo 'Missing RELEASE_STORE_PASSWORD.' >&2; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo 'Missing RELEASE_KEY_ALIAS.' >&2; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo 'Missing RELEASE_KEY_PASSWORD.' >&2; exit 1; }
          bash ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace \
            --build-cache \
            --max-workers=4 \
            -POMNIGRAM_CI_ABIS=armeabi-v7a,arm64-v8a \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify APK and prepare artifact
        run: |
          apk=$(find TMessagesProj_App/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify "$apk"
          apk_name="OmniGram-${GITHUB_SHA::7}.apk"
          mkdir -p artifacts
          cp "$apk" "artifacts/$apk_name"
          sha256sum "artifacts/$apk_name" | tee "artifacts/$apk_name.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniGram-release-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f TMessagesProj/config/release.keystore TMessagesProj/google-services.json TMessagesProj_App/google-services.json
